name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/$checksums" --output "$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix web run build:edge
      - run: docker build -f web/Dockerfile -t home-security-dashboard:verify .
      - run: docker build -f deploy/live/Dockerfile -t home-security-gateway:verify .
# Deliberately no deployment, registry publishing, production secrets or live tests.
